<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치위생 전공용어 사전</title>
<style>
  :root {
    --navy: #19324d;
    --teal: #247c78;
    --teal-light: #e8f5f3;
    --bg: #f4f7fa;
    --line: #dfe7ee;
    --text: #243447;
    --muted: #66788a;
    --white: #ffffff;
    --danger: #a63838;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 25px max(24px, calc((100% - 1180px) / 2));
  }
  .brand { font-size: 13px; letter-spacing: .08em; opacity: .82; }
  header h1 { margin: 5px 0 4px; font-size: 28px; }
  header p { margin: 0; color: #d9e7f1; font-size: 14px; }
  main { max-width: 1180px; margin: 28px auto; padding: 0 22px 40px; }
  .search-panel {
    background: var(--white); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; box-shadow: 0 8px 25px rgba(25,50,77,.05);
  }
  .search-panel h2 { margin: 0 0 5px; font-size: 18px; }
  .search-panel p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .search-row { display: flex; gap: 10px; }
  input[type="search"] {
    flex: 1; min-width: 0; border: 1px solid #cbd7e2; border-radius: 10px;
    padding: 13px 14px; font-size: 15px; outline: none;
  }
  input[type="search"]:focus { border-color: var(--teal); box-shadow: 0 0 0 3px #247c7820; }
  button, select {
    font: inherit; cursor: pointer; border-radius: 9px;
  }
  button { border: 0; padding: 10px 14px; font-weight: 700; }
  .primary { background: var(--teal); color: white; }
  .primary:hover { background: #1b6965; }
  .secondary { background: #eef3f7; color: var(--navy); }
  .secondary:hover { background: #e1eaf1; }
  .filter-row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px;
  }
  .filter-row label { color: var(--muted); font-size: 13px; }
  select { padding: 9px 12px; border: 1px solid #cbd7e2; background: white; color: var(--text); }
  .layout { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  .panel { background: white; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel-heading { padding: 17px 18px; border-bottom: 1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .panel-heading h2 { font-size: 16px; margin: 0; }
  .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .term-list { padding: 8px; max-height: 560px; overflow: auto; }
  .term-item {
    width: 100%; text-align: left; display: block; padding: 12px;
    background: transparent; border: 1px solid transparent; margin-bottom: 4px;
  }
  .term-item:hover { background: #f5f9fb; }
  .term-item.active { background: var(--teal-light); border-color: #c5e4e0; }
  .term-item strong { display: block; font-size: 14px; color: var(--navy); }
  .term-item span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .detail { padding: 25px; min-height: 340px; }
  .search-display { background: transparent; }
  .search-display-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .search-display-heading h2 { margin:0; color:var(--navy); font-size:20px; }
  .search-display-content { display:flex; flex-direction:column; gap:14px; }
  .featured-term { background:white; border:2px solid #b8dcd8; border-radius:16px; padding:24px; box-shadow:0 8px 25px rgba(25,50,77,.06); }
  .featured-term h3 { margin:4px 0 0; font-size:30px; color:var(--navy); }
  .featured-term .term-english { color:var(--muted); margin:2px 0 16px; }
  .featured-term .definition-block { margin-top:12px; }
  .related-section { background:#edf3f7; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .related-section h3 { margin:0 0 10px; color:var(--navy); font-size:16px; }
  .related-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:9px; }
  .related-card { text-align:left; border:1px solid #d4e0e8; background:white; border-radius:10px; padding:12px; }
  .related-card strong { display:block; color:var(--navy); font-size:14px; }
  .related-card span { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
  .related-card:hover { border-color:var(--teal); background:var(--teal-light); }
  .other-results { color:var(--muted); font-size:13px; padding:2px 2px 0; }
  @media (max-width:760px) { .featured-term { padding:18px; } .featured-term h3 { font-size:25px; } .related-cards { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .eyebrow { font-size: 12px; font-weight: 700; color: var(--teal); }
  .detail h2 { margin: 4px 0 0; font-size: 27px; color: var(--navy); }
  .english { margin: 2px 0 18px; color: var(--muted); }
  .definition-block { background: #f7fafc; border: 1px solid var(--line); padding: 16px; border-radius: 11px; margin-top: 14px; }
  .definition-block h3 { font-size: 14px; margin: 0 0 7px; }
  .definition-block p { margin: 0; }
  .detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .tag-list { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { padding: 6px 10px; border-radius: 99px; color: #24615e; background: var(--teal-light); font-size: 13px; }
  .tag-button { border: 1px solid #c5e4e0; }
  .empty { padding: 28px 16px; text-align:center; color:var(--muted); font-size:14px; }
  .notice { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .status { min-height: 24px; margin-top: 10px; font-size: 13px; color: var(--teal); }
  .status.error { color: var(--danger); }
  footer { text-align:center; padding: 0 20px 28px; color:var(--muted); font-size:12px; }
  @media (max-width: 760px) {
    header { padding: 22px; }
    header h1 { font-size: 23px; }
    main { margin-top: 18px; padding: 0 13px 28px; }
    .layout { grid-template-columns: 1fr; }
    .term-list { max-height: 270px; }
    .search-panel { padding: 17px; }
    .search-row { flex-direction: column; }
    .search-row button { width:100%; }
    .detail { padding: 19px; }
    .detail h2 { font-size: 23px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">DENTAL HYGIENE · STUDY TOOL</div>
  <h1>치위생 전공용어 사전</h1>
  <p>어려운 전공용어를 검색하고, 쉬운 설명으로 이해해 보세요.</p>
</header>

<main>
  <section class="search-panel" aria-labelledby="searchTitle">
    <h2 id="searchTitle">전공용어 검색</h2>
    <p>한글 용어 또는 영문 용어를 입력하세요.</p>
    <form id="searchForm" class="search-row">
      <input id="searchInput" type="search" placeholder="예: 치은염, Gingivitis" aria-label="검색할 전공용어" autocomplete="off">
      <button class="primary" type="submit">용어 검색</button>
      <button class="secondary" type="button" id="resetButton">초기화</button>
    </form>
    <div class="filter-row">
      <label for="subjectFilter">과목별 보기</label>
      <select id="subjectFilter">
        <option value="전체">전체 과목</option>
        <option value="구강해부학">구강해부학</option>
        <option value="치주학">치주학</option>
        <option value="예방치학">예방치학</option>
        <option value="구강병리학">구강병리학</option>
        <option value="치과재료학">치과재료학</option>
        <option value="치과방사선학">치과방사선학</option>
        <option value="치과임상">치과임상</option>
        <option value="구강보건학">구강보건학</option>
      </select>
      <button type="button" class="secondary" id="allButton">전체 용어</button>
      <button type="button" class="secondary" id="favoritesButton">★ 즐겨찾기만 보기</button>
    </div>
    <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
  </section>

  <section id="searchResultsPanel" class="search-display" style="margin-top:18px; display:none;" aria-live="polite">
    <div class="search-display-heading">
      <h2>검색한 용어</h2>
      <span class="count" id="directResultCount">0개</span>
    </div>
    <div id="directResults" class="search-display-content"></div>
  </section>

  <section class="layout">
    <aside class="panel">
      <div class="panel-heading">
        <h2 id="listTitle">용어 목록</h2>
        <span class="count" id="termCount">0개</span>
      </div>
      <div id="termList" class="term-list"></div>
    </aside>

    <article class="panel">
      <div class="panel-heading">
        <h2>용어 상세 정보</h2>
        <span class="count">전공 학습</span>
      </div>
      <div id="detailPanel" class="detail">
        <div class="empty">왼쪽 목록에서 용어를 선택하거나 검색해 주세요.</div>
      </div>
    </article>
  </section>
  <p class="notice">※ 학습용 예시 데이터입니다. 시험 및 임상 학습 시에는 전공 교재와 담당 교수의 자료를 함께 확인하세요.</p>
</main>
<footer>치위생 전공용어 사전 · 별도 설치 없이 실행되는 학습용 웹페이지</footer>

<script>
"use strict";

const terms = [
  {id:1, name:"치은염", english:"Gingivitis", subject:"치주학",
   definition:"치아 주위의 잇몸(치은)에 염증이 발생한 상태이다.",
   easy:"잇몸이 붉어지거나 붓고, 양치할 때 피가 날 수 있는 상태예요. 치주염과 달리 치아를 지지하는 조직의 파괴가 없는 단계로 설명돼요.",
   related:["치주염","치은","치태"]},
  {id:2, name:"치주염", english:"Periodontitis", subject:"치주학",
   definition:"치아를 지지하는 치주조직에 염증이 생기고 조직 파괴가 진행되는 질환이다.",
   easy:"잇몸 염증이 진행되어 치아를 지지하는 조직과 뼈가 손상될 수 있는 질환이에요.",
   related:["치은염","치주조직","치태"]},
  {id:3, name:"치태", english:"Dental plaque", subject:"예방치학",
   definition:"치아 표면에 형성되는 세균을 포함한 끈끈한 생물막이다.",
   easy:"치아 표면에 붙어 있는 끈끈한 세균막이에요. 제대로 제거하지 않으면 잇몸 염증이나 치아우식과 관련될 수 있어요.",
   related:["치석","치은염","치아우식"]},
  {id:4, name:"치석", english:"Dental calculus", subject:"예방치학",
   definition:"치태가 타액 등의 무기질과 결합하여 석회화된 침착물이다.",
   easy:"치태가 단단하게 굳은 것이에요. 칫솔질만으로 제거하기 어려워 전문적인 치석 제거가 필요할 수 있어요.",
   related:["치태","스케일링","치주염"]},
  {id:5, name:"치아우식", english:"Dental caries", subject:"구강병리학",
   definition:"치아의 무기질이 산에 의해 탈회되고 치아 구조가 손상되는 질환이다.",
   easy:"입안 세균이 당을 분해하면서 만든 산 등으로 치아가 손상되는 질환이에요. 흔히 충치라고 불러요.",
   related:["탈회","재광화","불소"]},
  {id:6, name:"탈회", english:"Demineralization", subject:"예방치학",
   definition:"치아 조직에서 칼슘과 인산 등의 무기질이 빠져나가는 과정이다.",
   easy:"치아를 단단하게 유지하는 무기질이 치아에서 빠져나오는 과정이에요.",
   related:["재광화","치아우식","불소"]},
  {id:7, name:"재광화", english:"Remineralization", subject:"예방치학",
   definition:"탈회된 치아 조직에 칼슘과 인산 등의 무기질이 다시 침착되는 과정이다.",
   easy:"치아에서 빠져나간 무기질이 다시 보충되는 과정이에요. 타액과 불소가 이 과정에 도움을 줄 수 있어요.",
   related:["탈회","불소","치아우식"]},
  {id:8, name:"치은", english:"Gingiva", subject:"구강해부학",
   definition:"치아의 치경부와 치조돌기 부위를 둘러싸는 구강 점막의 일부이다.",
   easy:"치아 주변을 둘러싸고 있는 잇몸 조직을 말해요.",
   related:["치은염","치주조직","치주낭"]},
  {id:9, name:"치주조직", english:"Periodontium", subject:"치주학",
   definition:"치아를 지지하고 유지하는 치은, 치주인대, 백악질, 치조골을 포함하는 조직이다.",
   easy:"치아가 턱뼈 안에서 안정적으로 유지되도록 돕는 조직들을 통틀어 말해요.",
   related:["치은","치주염","치조골"]},
  {id:10, name:"치조골", english:"Alveolar bone", subject:"구강해부학",
   definition:"치아의 치근을 둘러싸고 치아를 지지하는 턱뼈의 일부이다.",
   easy:"치아 뿌리를 둘러싸고 치아를 받쳐 주는 뼈예요.",
   related:["치주조직","치주염","치아"]},
  {id:11, name:"치주낭", english:"Periodontal pocket", subject:"치주학",
   definition:"치은과 치아 사이의 치은열구가 병적으로 깊어진 공간이다.",
   easy:"잇몸과 치아 사이의 틈이 정상보다 깊어진 상태를 말해요. 치주 상태를 평가할 때 확인해요.",
   related:["치은","치주염","치주탐침"]},
  {id:12, name:"불소", english:"Fluoride", subject:"예방치학",
   definition:"치아의 탈회를 억제하고 재광화를 촉진하는 데 도움을 주는 원소이다.",
   easy:"치아가 산에 의해 손상되는 것을 줄이고 무기질이 다시 보충되는 데 도움을 주는 성분이에요.",
   related:["재광화","탈회","치아우식"]},
  {id:13, name:"치주탐침", english:"Periodontal probe", subject:"치주학",
   definition:"치주낭 깊이 등을 측정하기 위해 눈금이 표시된 기구이다.",
   easy:"잇몸과 치아 사이의 깊이 등을 측정할 때 사용하는 눈금이 있는 기구예요.",
   related:["치주낭","치주염","치주검사"]},
  {id:14, name:"타액", english:"Saliva", subject:"구강해부학",
   definition:"침샘에서 분비되어 구강 내를 적시고 소화 및 구강 보호 기능에 관여하는 액체이다.",
   easy:"침이라고도 해요. 음식물을 삼키기 쉽게 하고 구강을 보호하며 산을 완충하는 데 도움을 줘요.",
   related:["재광화","완충능","구강건조증"]},
  {id:15, name:"알지네이트", english:"Alginate", subject:"치과재료학",
   definition:"치과에서 예비 인상 채득 등에 사용하는 비가역성 하이드로콜로이드 인상재이다.",
   easy:"치아와 잇몸의 모양을 본뜨는 데 사용하는 재료 중 하나예요. 굳은 뒤에는 원래 상태로 되돌릴 수 없어요.",
   related:["인상재","석고","인상채득"]},
  {id:16, name:"치면열구전색", english:"Pit and fissure sealant", subject:"예방치학",
   definition:"구치의 소와와 열구를 재료로 메워 우식 발생 위험을 낮추는 예방 처치이다.",
   easy:"어금니 씹는 면의 좁고 깊은 홈을 재료로 메워 음식물과 세균이 쌓이기 어렵게 하는 예방 처치예요.",
   related:["치아우식","불소","예방치학"]},
  {id:17, name:"백악질", english:"Cementum", subject:"구강해부학",
   definition:"치근 표면을 덮고 치주인대 섬유가 부착되는 데 관여하는 석회화 조직이다.",
   easy:"치아 뿌리 표면을 덮고 있으며 치아를 지지하는 섬유가 붙는 데 관여하는 조직이에요.",
   related:["치주조직","치주인대","치근"]},
  {id:18, name:"치주인대", english:"Periodontal ligament", subject:"구강해부학",
   definition:"치근의 백악질과 치조골 사이에 위치하여 치아를 지지하는 결합조직이다.",
   easy:"치아 뿌리와 치조골 사이에서 치아를 지지하고 씹는 힘을 전달하는 조직이에요.",
   related:["치주조직","백악질","치조골"]},
  {id:19, name:"법랑질", english:"Enamel", subject:"구강해부학",
   definition:"치관의 바깥층을 덮는 인체에서 가장 단단한 석회화 조직이다.",
   easy:"치아의 겉면을 덮는 아주 단단한 층이에요. 한 번 손상되면 스스로 재생되지 않아요.",
   related:["상아질", "치관", "탈회"]},
  {id:20, name:"상아질", english:"Dentin", subject:"구강해부학",

const FAVORITES_KEY = "dentalHygieneDictionaryFavorites_v1";
const termList = document.getElementById("termList");
const detailPanel = document.getElementById("detailPanel");
const searchInput = document.getElementById("searchInput");
const subjectFilter = document.getElementById("subjectFilter");
const statusMessage = document.getElementById("statusMessage");
const termCount = document.getElementById("termCount");
const listTitle = document.getElementById("listTitle");

let currentTermId = null;
let currentQuery = "";
let favoritesOnly = false;
let favorites = loadFavorites();

function loadFavorites() {
  try {
    const stored = localStorage.getItem(FAVORITES_KEY);
    const parsed = stored ? JSON.parse(stored) : [];
    return Array.isArray(parsed) ? parsed.filter(id => Number.isInteger(id)) : [];
  } catch (error) {
    return [];
  }
}
function saveFavorites() {
  try {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
    return true;
  } catch (error) {
    setStatus("브라우저 저장 공간을 사용할 수 없어 즐겨찾기를 저장하지 못했습니다.", true);
    return false;
  }
}
function setStatus(message, isError = false) {
  statusMessage.textContent = message;
  statusMessage.className = isError ? "status error" : "status";
}
function normalize(value) {
  return String(value || "").trim().toLocaleLowerCase("ko-KR");
}
function getFilteredTerms() {
  const query = normalize(currentQuery);
  const subject = subjectFilter.value;
  return terms.filter(term => {
    const matchesSubject = subject === "전체" || term.subject === subject;
    const matchesFavorite = !favoritesOnly || favorites.includes(term.id);
    const searchable = [term.name, term.english, term.subject, term.definition, term.easy, ...term.related].join(" ");
    const matchesQuery = !query || normalize(searchable).includes(query);
    return matchesSubject && matchesFavorite && matchesQuery;
  });
}
function renderList(preferredId = currentTermId) {
  const filtered = getFilteredTerms();
  termList.replaceChildren();
  termCount.textContent = `${filtered.length}개`;
  listTitle.textContent = favoritesOnly ? "즐겨찾기 목록" : "용어 목록";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = favoritesOnly && favorites.length === 0
      ? "저장된 즐겨찾기가 없습니다."
      : "검색 결과가 없습니다. 검색어 또는 과목을 확인해 주세요.";
    termList.appendChild(empty);
    if (preferredId && !terms.some(t => t.id === preferredId)) currentTermId = null;
    return;
  }

  filtered.forEach(term => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "term-item" + (term.id === preferredId ? " active" : "");
    button.setAttribute("aria-pressed", String(term.id === preferredId));
    const name = document.createElement("strong");
    name.textContent = `${favorites.includes(term.id) ? "★ " : ""}${term.name}`;
    const meta = document.createElement("span");
    meta.textContent = `${term.english} · ${term.subject}`;
    button.append(name, meta);
    button.addEventListener("click", () => {
      currentTermId = term.id;
      renderList(term.id);
      renderDetail(term.id);
      setStatus("");
    });
    termList.appendChild(button);
  });

  const selectedStillVisible = filtered.some(term => term.id === preferredId);
  const selected = filtered.find(term => term.id === preferredId) || filtered[0];
  currentTermId = selected.id;
  renderDetail(selected.id);
}
function renderDetail(id) {
  const term = terms.find(item => item.id === id);
  if (!term) {
    detailPanel.innerHTML = '<div class="empty">용어 정보를 찾을 수 없습니다.</div>';
    return;
  }
  detailPanel.replaceChildren();

  const eyebrow = document.createElement("div");
  eyebrow.className = "eyebrow";
  eyebrow.textContent = term.subject;
  const title = document.createElement("h2");
  title.textContent = term.name;
  const english = document.createElement("p");
  english.className = "english";
  english.textContent = term.english;

  detailPanel.append(eyebrow, title, english);
  addDefinitionBlock(detailPanel, "전문적 정의", term.definition);
  addDefinitionBlock(detailPanel, "쉬운 설명", term.easy);

  const relatedBlock = document.createElement("section");
  relatedBlock.className = "definition-block";
  const relatedHeading = document.createElement("h3");
  relatedHeading.textContent = "관련 용어";
  const relatedList = document.createElement("div");
  relatedList.className = "tag-list";
  const relatedTerms = term.related.map(name => terms.find(t => t.name === name)).filter(Boolean);
  if (relatedTerms.length === 0) {
    const none = document.createElement("p");
    none.textContent = "등록된 관련 용어가 없습니다.";
    relatedList.appendChild(none);
  } else {
    relatedTerms.forEach(related => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tag tag-button";
      button.textContent = related.name;
      button.addEventListener("click", () => {
        currentQuery = "";
        searchInput.value = "";
        subjectFilter.value = "전체";
        favoritesOnly = false;
        currentTermId = related.id;
        renderList(related.id);
        renderDetail(related.id);
        setStatus(`'${related.name}' 용어를 열었습니다.`);
      });
      relatedList.appendChild(button);
    });
  }
  relatedBlock.append(relatedHeading, relatedList);

  const actions = document.createElement("div");
  actions.className = "detail-actions";
  const favoriteButton = document.createElement("button");
  favoriteButton.type = "button";
  favoriteButton.className = favorites.includes(term.id) ? "secondary" : "primary";
  favoriteButton.textContent = favorites.includes(term.id) ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기 저장";
  favoriteButton.addEventListener("click", () => toggleFavorite(term.id));
  const copyButton = document.createElement("button");
  copyButton.type = "button";
  copyButton.className = "secondary";
  copyButton.textContent = "용어 설명 복사";
  copyButton.addEventListener("click", async () => {
    const text = `${term.name} (${term.english})\n과목: ${term.subject}\n전문적 정의: ${term.definition}\n쉬운 설명: ${term.easy}`;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        setStatus("용어 설명을 복사했습니다.");
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        setStatus(copied ? "용어 설명을 복사했습니다." : "복사를 지원하지 않는 환경입니다. 설명을 직접 선택해 복사해 주세요.", !copied);
      }
    } catch (error) {
      setStatus("복사할 수 없습니다. 설명을 직접 선택해 복사해 주세요.", true);
    }
  });
  actions.append(favoriteButton, copyButton);
  detailPanel.append(relatedBlock, actions);
}
function addDefinitionBlock(parent, headingText, contentText) {
  const block = document.createElement("section");
  block.className = "definition-block";
  const heading = document.createElement("h3");
  heading.textContent = headingText;
  const paragraph = document.createElement("p");
  paragraph.textContent = contentText || "설명을 준비 중입니다.";
  block.append(heading, paragraph);
  parent.appendChild(block);
}
function toggleFavorite(id) {
  if (!terms.some(term => term.id === id)) {
    setStatus("존재하지 않는 용어는 저장할 수 없습니다.", true);
    return;
  }
  if (favorites.includes(id)) {
    favorites = favorites.filter(favoriteId => favoriteId !== id);
    if (!saveFavorites()) return;
    setStatus("즐겨찾기에서 삭제했습니다.");
  } else {
    favorites.push(id);
    if (!saveFavorites()) return;
    setStatus("즐겨찾기에 저장했습니다.");
  }
  renderList(currentTermId);
  renderDetail(currentTermId);
}
function renderDirectResults(results, query) {
  const panel = document.getElementById("searchResultsPanel");
  const container = document.getElementById("directResults");
  const count = document.getElementById("directResultCount");
  container.replaceChildren();
  panel.style.display = query ? "block" : "none";
  count.textContent = `${results.length}개 일치`;

  if (!query) return;
  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty panel";
    empty.textContent = "검색 결과가 없습니다. 예: 치은염, 치태, 치석, Gingivitis";
    container.appendChild(empty);
    return;
  }

  // 정확히 일치하는 용어를 먼저 보여주고, 없으면 용어명으로 가장 가까운 결과를 크게 표시
  const q = normalize(query);
  const ranked = [...results].sort((a, b) => {
    const score = term => {
      const name = normalize(term.name), english = normalize(term.english);
      if (name === q || english === q) return 0;
      if (name.startsWith(q) || english.startsWith(q)) return 1;
      if (name.includes(q) || english.includes(q)) return 2;
      return 3;
    };
    return score(a) - score(b);
  });
  const term = ranked[0];

  const featured = document.createElement("article");
  featured.className = "featured-term";
  const subject = document.createElement("div");
  subject.className = "eyebrow";
  subject.textContent = `${term.subject} · 대표 검색 결과`;
  const title = document.createElement("h3");
  title.textContent = term.name;
  const english = document.createElement("div");
  english.className = "term-english";
  english.textContent = term.english;
  featured.append(subject, title, english);
  addDefinitionBlock(featured, "전문적 정의", term.definition);
  addDefinitionBlock(featured, "쉬운 설명", term.easy);

  const actions = document.createElement("div");
  actions.className = "detail-actions";
  const open = document.createElement("button");
  open.type = "button";
  open.className = "primary";
  open.textContent = "상세 정보 보기";
  open.addEventListener("click", () => {
    currentTermId = term.id;
    renderList(term.id);
    renderDetail(term.id);
    setStatus(`'${term.name}'의 상세 정보를 표시합니다.`);
    document.querySelector(".layout").scrollIntoView({behavior:"smooth", block:"start"});
  });
  const favorite = document.createElement("button");
  favorite.type = "button";
  favorite.className = "secondary";
  favorite.textContent = favorites.includes(term.id) ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기 저장";
  favorite.addEventListener("click", () => toggleFavorite(term.id));
  actions.append(open, favorite);
  featured.appendChild(actions);
  container.appendChild(featured);

  const relatedTerms = (term.related || [])
    .map(name => terms.find(item => item.name === name))
    .filter(Boolean);
  const relatedSection = document.createElement("section");
  relatedSection.className = "related-section";
  const relatedHeading = document.createElement("h3");
  relatedHeading.textContent = "관련 용어";
  relatedSection.appendChild(relatedHeading);
  if (relatedTerms.length) {
    const cards = document.createElement("div");
    cards.className = "related-cards";
    relatedTerms.forEach(related => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "related-card";
      const name = document.createElement("strong");
      name.textContent = related.name;
      const meta = document.createElement("span");
      meta.textContent = `${related.english} · ${related.subject}`;
      button.append(name, meta);
      button.addEventListener("click", () => {
        searchInput.value = related.name;
        currentQuery = related.name;
        favoritesOnly = false;
        runSearch(false);
        setStatus(`'${related.name}' 용어와 관련 용어를 표시합니다.`);
        panel.scrollIntoView({behavior:"smooth", block:"start"});
      });
      cards.appendChild(button);
    });
    relatedSection.appendChild(cards);
  } else {
    const none = document.createElement("p");
    none.className = "other-results";
    none.textContent = "등록된 관련 용어가 없습니다.";
    relatedSection.appendChild(none);
  }
  container.appendChild(relatedSection);

  if (ranked.length > 1) {
    const others = document.createElement("p");
    others.className = "other-results";
    others.textContent = `그 밖의 검색 일치 항목 ${ranked.length - 1}개는 왼쪽 용어 목록에서 확인할 수 있어요.`;
    container.appendChild(others);
  }
}
function runSearch(showEmptyWarning = true) {
  const query = searchInput.value.trim();
  currentQuery = query;
  favoritesOnly = false;
  renderList(null);
  const results = getFilteredTerms();
  renderDirectResults(results, query);
  if (!query) {
    setStatus(showEmptyWarning ? "검색어를 입력해 주세요." : "용어명이나 영문명을 입력하면 검색 결과가 표시됩니다.", showEmptyWarning);
  } else if (results.length === 0) {
    setStatus("검색 결과가 없습니다. 예시 용어인 '치은염', '치태', '치석' 등을 검색해 보세요.", true);
  } else {
    setStatus(`${results.length}개의 용어를 찾았습니다.`);
  }
}
document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  if (!searchInput.value.trim()) {
    setStatus("검색어를 입력해 주세요.", true);
    searchInput.focus();
    return;
  }
  runSearch(true);
});
// 검색어를 입력하는 동안에도 결과가 바로 갱신되도록 처리
searchInput.addEventListener("input", () => {
  if (!searchInput.value.trim()) {
    currentQuery = "";
    favoritesOnly = false;
    renderList(null);
    renderDirectResults([], "");
    setStatus("검색어를 입력하면 검색 결과와 설명이 바로 표시됩니다.");
    return;
  }
  runSearch(false);
});
document.getElementById("resetButton").addEventListener("click", () => {
  searchInput.value = "";
  currentQuery = "";
  subjectFilter.value = "전체";
  favoritesOnly = false;
  currentTermId = terms.length ? terms[0].id : null;
  renderList(currentTermId);
  renderDirectResults([], "");
  setStatus("검색 조건을 초기화했습니다.");
});
subjectFilter.addEventListener("change", () => {
  currentQuery = searchInput.value.trim();
  renderList(null);
  const results = getFilteredTerms();
  setStatus(results.length ? `${results.length}개의 용어를 표시합니다.` : "선택한 조건에 해당하는 용어가 없습니다.", results.length === 0);
});
document.getElementById("allButton").addEventListener("click", () => {
  searchInput.value = "";
  currentQuery = "";
  subjectFilter.value = "전체";
  favoritesOnly = false;
  renderList(terms.length ? terms[0].id : null);
  renderDirectResults([], "");
  setStatus("전체 용어를 표시합니다.");
});
document.getElementById("favoritesButton").addEventListener("click", () => {
  favoritesOnly = !favoritesOnly;
  currentQuery = searchInput.value.trim();
  renderList(null);
  const results = getFilteredTerms();
  setStatus(favoritesOnly ? `즐겨찾기 ${results.length}개를 표시합니다.` : "전체 목록으로 돌아왔습니다.",
    favoritesOnly && results.length === 0);
});

renderList(terms.length ? terms[0].id : null);
</script>
</body>
</html>
